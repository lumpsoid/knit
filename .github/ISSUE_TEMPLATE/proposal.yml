name: Proposal
description: Suggest a feature or a change. Please open one before a larger pull request.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How could Knit solve it? Sketches and alternatives are welcome.
    validations:
      required: true
  - type: dropdown
    id: implement
    attributes:
      label: Would you implement it?
      options:
        - Yes, I'd like to send a pull request
        - Maybe, with some guidance
        - No, just suggesting
    validations:
      required: true
