name: Bug report
description: Something in Knit doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Knit version
      description: Settings → About, e.g. `0.1.0 (2391c1d)`.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a collection
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots or a screen recording help. Leave out anything private from your cards.
