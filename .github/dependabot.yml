version: 2

updates:
  - package-ecosystem: pub
    directories: ['/', '/packages/*']
    schedule:
      interval: weekly
    groups:
      pub-minor:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types: [minor, patch]
