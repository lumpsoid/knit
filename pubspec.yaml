name: knit
description: "Local-first cards in chat-style collections, woven together with links."
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.6+7

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # App localization (l10n) — ARB-driven message catalogs generated into
  # lib/l10n/ (see l10n.yaml). flutter_localizations supplies the framework
  # delegates; intl backs the generated plural/placeholder formatting.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0

  # Local-first store — one SQLite DB file per device (spec §6.1).
  sqflite: ^2.4.1

  # Schema migrations for the sqflite storages — local package.
  sql_migrator:
    path: packages/sql_migrator

  # The UI side-effect seam (cross_feature.md §4) — local package.
  effect_emitter:
    path: packages/effect_emitter

  # Ed25519 keygen/sign/verify + SHA-256 for the identity layer (spec §5/§6.8).
  cryptography: ^2.7.0

  # Logging seam — package:logging is itself the abstraction: layers log to
  # named Loggers; composition (main.dart) routes Logger.root.onRecord.
  logging: ^1.3.0
  fcis_core:
    git:
      url: "https://github.com/lumpsoid/fcis_core_dart"
      ref: "2fe7d6728ea17fd1835a5bd10fc83c3c3aa328ca"
  external_signal:
    git:
      url: "https://github.com/lumpsoid/external_signal_dart"
      ref: "1450c4867b26c59c98d8ad3ef949348043e79001"
  result_dart:
    git:
      url: "https://github.com/lumpsoid/result_dart"
      ref: "263a3da899e8bfc62fc32f3e4d3c5abe86461cf3"
  selector_flutter:
    git:
      url: "https://github.com/lumpsoid/selector_flutter"
      ref: "091a9b93af23525f9e81a9cd19839375e43e9666"
  fetch_dart:
    git:
      url: "https://github.com/lumpsoid/fetch_dart"
      ref: "0a6ee659f98292e8fec1627645c6cebe63a62e1e"
  # UUIDv7 minting behind the IdGenerator port (spec §6.1) — time-ordered ids.
  uuid: ^4.5.3

  # Attachment capture + storage foundation (spec §6.4/§7.4.8). image_picker sits
  # behind the ImagePickerPort; path_provider locates the on-disk blob dir; record
  # sits behind the AudioRecorderPort (audio-message capture); audioplayers sits
  # behind the AudioPlayerPort (audio-message playback); file_picker sits behind
  # the FilePickerPort (arbitrary-file attachment capture).
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  record: ^7.1.0
  audioplayers: ^6.1.0
  file_picker: ^12.0.0-beta.7
  # Pure-Dart decode/resize/re-encode behind the ImageOptimizerPort (the opt-in
  # "Optimise size" for a photo added to a card).
  image: ^4.11.0

  # Device-local preference persistence (theme + language). These are this
  # device's UI settings, not synced graph data — so they live in
  # shared_preferences, never the SQLite/change-log store.
  shared_preferences: ^2.5.5

  # App name + version/build number for the About screen.
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0

  # Zip encode/decode for the backup bundle (export/import — settings §4 Data).
  # Pure Dart, no platform channel, so the codec round-trips in unit tests.
  archive: ^4.0.0

  # Hand a link card's URL to the system browser (§4.2) — tapping a link card
  # opens it externally via the platform's default handler.
  url_launcher: ^6.3.0
  receive_sharing_intent: ^1.9.0

  # Keep the screen on while a collection is presented (§4.9).
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Desktop/CI SQLite for tests that need a real DB (the sync storages are
  # abstracted, so most tests use the in-memory impl and need neither).
  sqflite_common_ffi: ^2.3.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate the localized AppLocalizations sources from the ARB catalogs in
  # lib/l10n/ on `flutter pub get` / build (config in l10n.yaml).
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
